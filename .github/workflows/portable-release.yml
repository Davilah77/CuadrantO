name: Crear versiones portables

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            label: Windows x64
            executable: Cuadrante.exe
          - os: ubuntu-24.04
            platform: linux-x64
            label: Linux x64
            executable: Cuadrante

    runs-on: ${{ matrix.os }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar soporte gráfico de Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip pyinstaller && python -m pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v

      - name: Compilar aplicación
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Cuadrante app.py

      - name: Determinar versión
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            $version = "${{ github.event.release.tag_name }}".TrimStart("v")
          } else {
            $version = "manual-${{ github.run_number }}"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Empaquetar Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $folder = "package/Cuadrante"
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item "dist/${{ matrix.executable }}" $folder
          Copy-Item "LEEME-PORTABLE.txt" $folder
          Compress-Archive -Path "$folder/*" -DestinationPath "Cuadrante-portable-${{ steps.version.outputs.value }}-${{ matrix.platform }}.zip"

      - name: Empaquetar Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p package/Cuadrante
          cp "dist/${{ matrix.executable }}" package/Cuadrante/
          cp LEEME-LINUX.txt package/Cuadrante/
          chmod +x package/Cuadrante/Cuadrante
          tar -C package/Cuadrante -czf "Cuadrante-portable-${{ steps.version.outputs.value }}-${{ matrix.platform }}.tar.gz" .

      - name: Guardar paquete
        uses: actions/upload-artifact@v6
        with:
          name: Cuadrante-${{ matrix.platform }}
          path: Cuadrante-portable-*
          if-no-files-found: error

      - name: Adjuntar paquete al release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${{ github.event.release.tag_name }}" Cuadrante-portable-* --clobber
